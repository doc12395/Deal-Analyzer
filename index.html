<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VARNIK Deal Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #666666;
      --accent: #ccff00;
      --accent-dark: #a3cc00;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
    }
    .hero {
      min-height: 100vh;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    }
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }
    .nav-right {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-content { max-width: 800px; margin-bottom: 60px; }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.1;
    }
    .hero-subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      font-style: italic;
      margin-bottom: 30px;
    }
    .hero-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 40px;
    }
    .search-container {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px;
      border-radius: 4px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }
    .search-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .search-input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-bottom-color: var(--accent); }
    .analyze-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .analyze-btn:hover:not(:disabled) { background: var(--accent-dark); }
    .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .search-hint {
      font-size: 11px;
      color: var(--muted);
      text-align: left;
    }
    .footer-text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 600px;
    }
    .loading { display: none; text-align: center; padding: 40px 20px; }
    .loading.active { display: block; }
    .spinner {
      border: 2px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { display: none; background: rgba(255,0,0,0.1); border: 1px solid #ff4444; padding: 16px; margin: 20px auto; max-width: 600px; border-radius: 2px; color: #ff8888; font-size: 13px; }
    .error.active { display: block; }
